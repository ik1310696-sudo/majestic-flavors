<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Irfan Game - Fixed</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;touch-action:none}
body{background:#0a0a0a;overflow:hidden}
#game{width:100vw;height:100vh;position:relative;background:#111;overflow:hidden}
#city{position:absolute;width:100%;height:100%;background:linear-gradient(#222 1px,transparent 1px),linear-gradient(90deg,#222 1px,transparent 1px),#1a1a1a;background-size:40px 40px,40px 40px,100% 100%;left:0;top:0}
.car{position:absolute;border-radius:6px;border:2px solid #000;z-index:5;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:9px;box-shadow:0 2px 10px #000}
.lambo{width:70px;height:30px;background:#ffcc00;color:#000;top:30%;left:30%}
.bugatti{width:75px;height:32px;background:#0066ff;color:#fff;top:50%;left:60%}
.bmw{width:68px;height:28px;background:#fff;color:#000;top:70%;left:20%}
.ferrari{width:72px;height:30px;background:#ff0000;color:#fff;top:20%;left:70%}
.hayabusa{width:60px;height:24px;background:#ff6600;color:#fff;border-radius:20px;top:60%;left:40%}
#player{position:absolute;width:20px;height:24px;background:#F5B70A;border:2px solid #000;border-radius:4px;z-index:10;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;font-weight:900;color:#000}
#ui{position:absolute;top:0;left:0;right:0;padding:8px;background:rgba(0,0,0,0.8);z-index:20;display:flex;justify-content:space-between;color:#fff;font-size:12px;font-weight:900}
#controls{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:space-between;padding:0 10px;z-index:20}
.joy{width:100px;height:100px;background:rgba(255,255,255,0.15);border-radius:50%;border:2px solid #F5B70A;position:relative}
#stick{width:40px;height:40px;background:#F5B70A;border-radius:50%;position:absolute;top:30px;left:30px;border:2px solid #fff}
.btn{width:60px;height:60px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:10px}
#enter{background:#F5B70A;color:#000} #shoot{background:#f00;color:#fff}
</style>
</head>
<body>
<div id=game>
<div id=city></div>

<div id=ui>
<div><span style=color:#F5B70A>IRFAN GAME</span> GTA RIYADH ULTIMATE<br>💰 $<span id=money>0</span> | 🚗 <span id=speed>0</span> KM | 🔫 <span id=ammo>30</span></div>
<div>👕 <span id=carName>ON FOOT</span></div>
</div>

<!-- CARS FIXED - AB DIKHENGE SAAMNE -->
<div class="car lambo" data-name="LAMBORGHINI">LAMBO</div>
<div class="car bugatti" data-name="BUGATTI">BUGATTI</div>
<div class="car bmw" data-name="BMW M5">BMW M5</div>
<div class="car ferrari" data-name="FERRARI">FERRARI</div>
<div class="car hayabusa" data-name="HAYABUSA">HAYABUSA</div>

<div id=player>I</div>

<div id=controls>
<div class=joy id=joy><div id=stick></div></div>
<div style=display:flex;gap:8px>
<div class=btn id=enter>ENTER</div>
<div class=btn id=shoot>SHOOT</div>
</div>
</div>
</div>

<script>
let px=50, py=50, inCar=false, currentCar=null, keys={x:0,y:0}, money=0;
let cars=document.querySelectorAll('.car');
let player=document.getElementById('player');

function tryEnter(){
if(inCar){
inCar=false; player.style.display='flex'; currentCar=null;
document.getElementById('carName').textContent='ON FOOT';
return;
}
let near=null;
cars.forEach(c=>{
let rect=c.getBoundingClientRect();
let pr=player.getBoundingClientRect();
let dist=Math.sqrt((rect.left-pr.left)**2+(rect.top-pr.top)**2);
if(dist<100) near=c;
});
if(near){
inCar=true; currentCar=near; player.style.display='none';
document.getElementById('carName').textContent=near.dataset.name;
money+=100; document.getElementById('money').textContent=money;
}
}

// Joystick
let joy=document.getElementById('joy'), stick=document.getElementById('stick'), drag=false;
joy.addEventListener('touchstart',()=>drag=true);
joy.addEventListener('touchend',()=>{drag=false; keys={x:0,y:0}; stick.style.left='30px'; stick.style.top='30px';});
joy.addEventListener('touchmove',e=>{
if(!drag) return;
let r=joy.getBoundingClientRect();
let x=e.touches[0].clientX-r.left-50, y=e.touches[0].clientY-r.top-50;
let d=Math.min(35,Math.sqrt(x*x+y*y)), a=Math.atan2(y,x);
let nx=Math.cos(a)*d, ny=Math.sin(a)*d;
stick.style.left=30+nx+'px'; stick.style.top=30+ny+'px';
keys.x=nx/35; keys.y=ny/35;
if(inCar && currentCar){
currentCar.style.left=(parseFloat(currentCar.style.left||50)+keys.x*1.5)+'%';
currentCar.style.top=(parseFloat(currentCar.style.top||50)+keys.y*1.5)+'%';
} else {
player.style.left=(50+keys.x*15)+'%';
player.style.top=(50+keys.y*15)+'%';
}
});

document.getElementById('enter').addEventListener('touchstart',e=>{e.preventDefault(); tryEnter();});
document.getElementById('shoot').addEventListener('touchstart',e=>{
e.preventDefault();
let b=document.createElement('div');
b.style.position='absolute'; b.style.width='8px'; b.style.height='8px';
b.style.background='#ff0'; b.style.borderRadius='50%';
b.style.left='50%'; b.style.top='50%'; b.style.zIndex='15';
document.getElementById('game').appendChild(b);
setTimeout(()=>b.remove(),300);
});
</script>
</body>
</html>
