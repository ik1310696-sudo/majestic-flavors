<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>IRFAN GAME</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;touch-action:none}
#game{width:100vw;height:100vh;background:#111;position:relative;overflow:hidden}
.car{position:absolute;border-radius:8px;border:3px solid #000;z-index:5;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:11px;box-shadow:0 0 15px #000}
#player{position:absolute;width:30px;height:34px;background:#F5B70A;border:3px solid #000;border-radius:6px;z-index:10;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;font-weight:900}
#ui{position:absolute;top:0;left:0;right:0;padding:10px;background:#000;z-index:20;color:#fff;font-weight:900;display:flex;justify-content:space-between}
#controls{position:absolute;bottom:15px;left:0;right:0;display:flex;justify-content:space-between;padding:0 15px;z-index:20}
.joy{width:110px;height:110px;background:rgba(255,255,255,0.2);border-radius:50%;border:3px solid #F5B70A;position:relative}
#stick{width:44px;height:44px;background:#F5B70A;border-radius:50%;position:absolute;top:33px;left:33px;border:3px solid #fff}
.btn{width:70px;height:70px;border-radius:50%;border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-weight:900}
#enter{background:#F5B70A;color:#000} #shoot{background:#f00;color:#fff}
</style>
</head>
<body>
<div id=game>
<div id=ui><div><span style=color:#F5B70A>IRFAN GAME</span> GTA RIYADH<br>💰 $<span id=money>0</span></div><div id=carName>ON FOOT</div></div>

<div class="car" style="background:#ffcc00;top:30%;left:20%;width:80px;height:35px;" data-name="LAMBORGHINI">LAMBO</div>
<div class="car" style="background:#0066ff;color:#fff;top:50%;left:60%;width:85px;height:36px;" data-name="BUGATTI">BUGATTI</div>
<div class="car" style="background:#fff;top:70%;left:15%;width:75px;height:33px;" data-name="BMW M5">BMW M5</div>
<div class="car" style="background:#f00;color:#fff;top:20%;left:65%;width:80px;height:35px;" data-name="FERRARI">FERRARI</div>
<div class="car" style="background:#ff6600;color:#fff;top:60%;left:35%;width:70px;height:30px;border-radius:20px" data-name="HAYABUSA">BIKE</div>

<div id=player>IRFAN</div>

<div id=controls>
<div class=joy id=joy><div id=stick></div></div>
<div style=display:flex;gap:10px><div class=btn id=enter>ENTER</div><div class=btn id=shoot>SHOOT</div></div>
</div>
</div>
<script>
let inCar=false,currentCar=null,keys={x:0,y:0},money=0;
function tryEnter(){
if(inCar){inCar=false;document.getElementById('player').style.display='flex';currentCar=null;document.getElementById('carName').textContent='ON FOOT';return;}
let near=null,best=150;let pr=document.getElementById('player').getBoundingClientRect();
document.querySelectorAll('.car').forEach(c=>{let r=c.getBoundingClientRect();let d=Math.sqrt((r.left-pr.left)**2+(r.top-pr.top)**2);if(d<best){best=d;near=c;}});
if(near){inCar=true;currentCar=near;document.getElementById('player').style.display='none';document.getElementById('carName').textContent=near.dataset.name;money+=100;document.getElementById('money').textContent=money;}
}
let joy=document.getElementById('joy'),stick=document.getElementById('stick'),drag=false;
joy.addEventListener('touchstart',e=>{drag=true});joy.addEventListener('touchend',e=>{drag=false;keys={x:0,y:0};stick.style.left='33px';stick.style.top='33px';});
joy.addEventListener('touchmove',e=>{
if(!drag)return;let r=joy.getBoundingClientRect();let x=e.touches[0].clientX-r.left-55,y=e.touches[0].clientY-r.top-55;let d=Math.min(40,Math.sqrt(x*x+y*y)),a=Math.atan2(y,x);let nx=Math.cos(a)*d,ny=Math.sin(a)*d;stick.style.left=33+nx+'px';stick.style.top=33+ny+'px';keys.x=nx/40;keys.y=ny/40;
if(inCar&&currentCar){currentCar.style.left=(parseFloat(currentCar.style.left)+keys.x*1.5)+'%';currentCar.style.top=(parseFloat(currentCar.style.top)+keys.y*1.5)+'%';}else{document.getElementById('player').style.left=(50+keys.x*35)+'%';document.getElementById('player').style.top=(50+keys.y*35)+'%';}
});
document.getElementById('enter').addEventListener('touchstart',e=>{e.preventDefault();tryEnter();});
</script>
</body>
</html>
